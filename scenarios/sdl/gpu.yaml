version: "2.0"
services:
  app:
    image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
    # The stock image's command exits immediately and it serves nothing, so the
    # container would crashloop and no probe could ever pass. This asks CUDA for
    # the device it was given and serves the answer, and writes nvidia-smi's own
    # device table beside it, so a pass means the GPU was really usable rather
    # than merely allocated.
    #
    # A literal block scalar, not a folded one: folding joins lines with spaces, and
    # the shell needs a real newline before `then`, `else` and `fi` to recognise them
    # as keywords at all. There is no `set -e`, so a check that fails still leaves the
    # server running and its own diagnostic readable in the file it was meant to write.
    command:
      - sh
      - -c
    args:
      - |-
        mkdir -p /srv
        python -c "import torch; print('cuda', torch.cuda.is_available(), torch.cuda.get_device_name(0))" > /srv/index.html 2>&1
        if command -v nvidia-smi >/dev/null 2>&1; then
          nvidia-smi --query-gpu=name,driver_version,memory.total,compute_cap --format=csv,noheader > /srv/gpu.csv 2>&1
        else
          echo "nvidia-smi: not installed in this image" > /srv/gpu.csv
        fi
        cd /srv && python -m http.server 8080
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
profiles:
  compute:
    app:
      resources:
        cpu:
          units: 1
        memory:
          size: 4Gi
        storage:
          size: 16Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: a100
  placement:
    dcloud:
      attributes:
        organization: overclock
      pricing:
        app:
          denom: uact
          amount: 100000
deployment:
  app:
    dcloud:
      profile: app
      count: 1
